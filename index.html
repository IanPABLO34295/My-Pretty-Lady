<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Be My Girl 💖</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<audio id="music" loop>
    <source src="love.mp3" type="audio/mpeg">
</audio>

<!-- Floating icons container -->
<div class="floating-icons"></div>

<!-- Main Card -->
<div class="card" id="mainCard">
    <h1 class="heart">💖</h1>
    <h2>Gayle, My Pretty Lady</h2>
    <p>
        You're such a beautiful lady with the prettiest of smiles..<br>
        <strong>Will you be my girl? </strong> 💘
    </p>

    <div class="buttons">
        <button id="yesBtn">YES 💕</button>
        <button id="noBtn">NO 😈</button>
    </div>
</div>

<!-- Contact Form Card -->
<div class="card hidden" id="formCard">
    <h2>Yay! One last thing 🥰</h2>
    <p>
        Drop your number or email so I can<br>
        plan something unforgettable 💐
    </p>

    <input 
        type="text" 
        id="contactInput" 
        placeholder="Phone number or email 💌"
    />

    <button id="submitBtn">Submit 💖</button>
</div>

<script src="script.js"></script>
</body>
</html>
